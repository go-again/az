# golangci-lint config for az. Modeled on gosqlite.org's config.
#
# Scope: az's own code is the root package (az.go, encoder.go, options.go,
# errors.go) and ./cmd/az. Everything under internal/ is vendored upstream
# (pierrec/lz4 → internal/lz4; klauspost/compress → internal/zstd, fse, huff0,
# le, cpuinfo, compress; the fuzz helper). We do not lint vendored code — it
# follows upstream style and shouldn't drift on our linters. Dot-prefixed
# reference clones (.compress/, .lz4/) and .plans/ are git-ignored and never
# loaded by go/packages, so no exclusion is needed for them.

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      # Deferred Close on cleanup paths where a prior error already
      # short-circuits (e.g. Decompress's `defer r.Close()`). Excluding the
      # specific closers keeps errcheck's value for genuine unchecked writes.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - (*github.com/go-again/az.Reader).Close
        - (*github.com/go-again/az.Writer).Close

  exclusions:
    # Never lint the vendored codecs — they are upstream forks.
    paths:
      - internal/
    rules:
      # Tests deliberately ignore errors on cleanup (closing a reader whose
      # read already failed, etc.).
      - linters: [errcheck]
        path: "_test\\.go"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
